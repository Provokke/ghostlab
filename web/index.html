<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ghostlab</title>
<meta name="theme-color" content="#06080d">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body data-screen="capture">
<div id="stage"><video id="video" playsinline muted loop></video><canvas id="overlay"></canvas></div>

<section data-screen="capture" class="screen">
  <h1 class="wordmark">Ghost<span>lab</span></h1>
  <p class="lede">Film a throw, a drop or a swing. Ghostlab measures it, tests its own prediction, and shows you the ghost.</p>
  <p class="label">Sample clips</p>
  <div id="demos" class="chips"></div>
  <p class="msg" role="status" aria-live="polite"></p>
</section>

<section data-screen="analysing" class="screen" hidden></section>
<section data-screen="confirm" class="screen" hidden></section>

<section data-screen="verdict" class="screen over" hidden>
  <span class="tag" hidden>Sample clip (synthetic)</span>
  <div class="verdict-card">
    <span class="badge"></span>
    <span class="off"></span>
  </div>
</section>

<section data-screen="playground" class="screen over" hidden></section>
<script type="module" src="js/screens.js"></script>
</body>
</html>
