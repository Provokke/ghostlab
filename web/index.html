<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ghostlab</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Ghost<span>lab</span></h1>
  <p>Film it. Ghostlab measures it, predicts what comes next, and shows you the ghost.</p>
</header>
<main>
  <section class="picker">
    <div id="demos" class="chips"></div>
    <label class="film">Film or upload a clip<input id="file" type="file" accept="video/*" capture="environment" hidden></label>
  </section>
  <section class="stage" id="stage" hidden>
    <div class="vwrap"><video id="video" playsinline muted loop controls></video><canvas id="overlay"></canvas></div>
    <div class="legend"><i class="real"></i> real path <i class="ghost"></i> ghost twin <i class="what"></i> what-if</div>
  </section>
  <section class="card trust" id="trust" hidden></section>
  <section class="card" id="whatif" hidden>
    <h2>What if&hellip;</h2>
    <div class="chips" id="presets"></div>
    <div class="say"><input id="say" type="text" placeholder="Say or type: what if this was on Mars?"><button class="chip" id="mic">Speak</button></div>
    <p class="sub" id="heard"></p>
    <label>Gravity <b id="gval"></b> m/s&sup2;<input id="g" type="range" min="1" max="26" step="0.1"></label>
    <label id="erow">Bounciness <b id="eval"></b><input id="e" type="range" min="0.1" max="0.98" step="0.01"></label>
  </section>
  <section class="card" id="numbers" hidden></section>
  <section class="card" id="words" hidden></section>
  <p id="msg" class="msg"></p>
</main>
<script src="app.js"></script>
</body>
</html>
