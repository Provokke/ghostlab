[project]
name = "ghostlab"
version = "0.1.0"
description = "Phone-first physics instrument: tracks an object in a clip, fits a model, tests its own prediction, and certifies or refuses."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "opencv-python-headless>=4.9",
    "imageio-ffmpeg>=0.5",
    "openai>=1.40",
    "httpx>=0.27",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
ui = ["playwright>=1.44"]
dev = ["pytest>=8", "ghostlab[web]"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ghostlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
