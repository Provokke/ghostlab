[project]
name = "ghostlab"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "opencv-python-headless>=4.9",
    "imageio-ffmpeg>=0.5",
    "openai>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ghostlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
