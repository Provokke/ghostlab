<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Ghostlab on iPhone (preview)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { --w: 393px; --h: 852px; } /* iPhone 15 logical screen */
  html, body { margin: 0; height: 100%; background: radial-gradient(circle at 50% 30%, #1b2230, #07090d); display: grid; place-items: center; font: 14px system-ui; color: #9aa6b8; }
  .stage { display: grid; gap: 14px; justify-items: center; padding: 20px 0; }
  .phone { position: relative; padding: 14px; border-radius: 68px; background: linear-gradient(145deg, #3a4150, #14171d); box-shadow: 0 0 0 2px #596070 inset, 0 30px 80px #000c, 0 0 0 1px #000; }
  .screen { position: relative; width: var(--w); height: var(--h); border-radius: 54px; overflow: hidden; background: #000; transform-origin: top center; }
  iframe { width: var(--w); height: var(--h); border: 0; display: block; background: #000; }
  .island { position: absolute; top: 11px; left: 50%; width: 120px; height: 34px; margin-left: -60px; background: #000; border-radius: 20px; z-index: 3; pointer-events: none; }
  .home { position: absolute; bottom: 8px; left: 50%; width: 140px; height: 5px; margin-left: -70px; background: #fff9; border-radius: 3px; z-index: 3; pointer-events: none; }
  .btn { position: absolute; width: 4px; background: #2b303b; border-radius: 2px; }
  .b1 { left: -3px; top: 150px; height: 30px; } .b2 { left: -3px; top: 200px; height: 56px; } .b3 { left: -3px; top: 270px; height: 56px; } .b4 { right: -3px; top: 220px; height: 90px; }
  label { display: flex; gap: 8px; align-items: center; }
  input { background: #0f131b; color: #cfd8e6; border: 1px solid #2a3140; border-radius: 8px; padding: 6px 10px; width: 260px; }
  button { background: #1a2130; color: #cfd8e6; border: 1px solid #2a3140; border-radius: 8px; padding: 6px 12px; cursor: pointer; }
</style></head>
<body><div class="stage">
  <div class="phone"><i class="btn b1"></i><i class="btn b2"></i><i class="btn b3"></i><i class="btn b4"></i>
    <div class="screen" id="screen"><div class="island"></div><div class="home"></div>
      <iframe id="app" allow="microphone; camera; autoplay; fullscreen"></iframe></div></div>
  <label>App URL <input id="url" value="http://localhost:8793/"><button id="go">Load</button><button id="fit">Fit to window</button></label>
  <div>iPhone 15 size (393 x 852). Layout preview in your desktop browser, not real iOS: camera, microphone and export still need a real iPhone.</div>
</div>
<script>
  const app = document.getElementById("app"), url = document.getElementById("url"), screen = document.getElementById("screen");
  const load = () => (app.src = url.value);
  document.getElementById("go").onclick = load; load();
  document.getElementById("fit").onclick = () => { const s = Math.min(1, (innerHeight - 140) / 900); document.querySelector(".phone").style.zoom = s; };
  if (innerHeight < 1000) document.getElementById("fit").click();
</script></body></html>
